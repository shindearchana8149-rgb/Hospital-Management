<!DOCTYPE html>
<html>
<head>
<title>Doctor Profile</title>

<style>

/* Reset */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

/* Colors */
:root{
--yellow:#FFD700;
--black:#000;
--white:#fff;
--gray:#f5f5f5;
}

/* Body */
body{
background:var(--gray);
}

/* Navbar */
.navbar{
background:var(--black);
padding:15px 50px;
display:flex;
gap:20px;
position:sticky;
top:0;
}

.navbar a{
color:white;
text-decoration:none;
padding:8px 20px;
border-radius:30px;
transition:.3s;
}

.navbar a:hover{
background:var(--yellow);
color:black;
}

/* Container */

.container{
width:500px;
margin:auto;
margin-top:30px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
transition:.3s;
}

.container:hover{
transform:translateY(-5px);
}

/* Heading */

h2{
text-align:center;
color:var(--yellow);
margin-bottom:20px;
}

/* Image */

.profile-img{
text-align:center;
margin-bottom:20px;
}

.profile-img img{
width:120px;
height:120px;
border-radius:50%;
border:4px solid var(--yellow);
object-fit:cover;
}

/* Form */

label{
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
transition:.3s;
}

input:focus{
border-color:var(--yellow);
outline:none;
}

/* Button */

button{
width:100%;
padding:12px;
background:var(--yellow);
border:none;
font-weight:bold;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:black;
color:white;
}

</style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">

<a href="/doctor/dashboard/">Dashboard</a>
<a href="/doctor/appointments/">Appointments</a>
<a href="/doctor/logout/">Logout</a>

</div>

<div class="container">

<h2>Doctor Profile</h2>

<div class="profile-img">

<img src="{{doctor.photo.url}}">

</div>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<label>Name</label>
<input type="text" name="name" value="{{doctor.name}}" required>

<label>Department</label>
<input type="text" name="department" value="{{doctor.department}}" required>

<label>Email</label>
<input type="email" name="email" value="{{doctor.email}}" required>

<label>Phone</label>
<input type="text" name="phone" value="{{doctor.phone}}" required>

<label>Update Photo</label>
<input type="file" name="photo">

<button type="submit">Update Profile</button>

</form>

</div>

</body>
</html>
