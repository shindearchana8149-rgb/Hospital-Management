<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Patients</title>

<style>

/* Reset */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

/* Colors */
:root{
--yellow:#FFD700;
--black:#000;
--white:#fff;
--gray:#f5f5f5;
}

/* Body */
body{
background:var(--gray);
}

/* Navbar */
.navbar{
background:var(--black);
padding:15px 50px;
display:flex;
gap:20px;
position:sticky;
top:0;
z-index:1000;
}

.navbar a{
color:white;
text-decoration:none;
padding:8px 20px;
border-radius:30px;
transition:.3s;
}

.navbar a:hover{
background:var(--yellow);
color:black;
}

/* Container */

.container{
padding:30px;
}

/* Heading */

h2{
text-align:center;
color:var(--yellow);
margin-bottom:25px;
}

/* Table */

table{
width:100%;
background:white;
border-collapse:collapse;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* Header */

th{
background:black;
color:white;
padding:15px;
}

/* Data */

td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

/* Hover */

tr:hover{
background:rgba(255,215,0,0.15);
transition:.3s;
}

/* Image */

img{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--yellow);
}

/* Animation */

table{
animation:fadeIn 0.7s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Responsive */

@media(max-width:768px){

table,thead,tbody,th,td,tr{
display:block;
}

th{
display:none;
}

td{
position:relative;
padding-left:50%;
text-align:right;
}

}

</style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">

<a href="/doctor/dashboard/">Dashboard</a>
<a href="/doctor/appointments/">Appointments</a>
<a href="/doctor/patients/">Patients</a>
<a href="/doctor/prescriptions/">Prescriptions</a>
<a href="/doctor/logout/">Logout</a>

</div>


<div class="container">

<h2>My Patients</h2>

<table>

<tr>
<th>Patient Name</th>
<th>Photo</th>
<th>Email</th>
<th>Action</th>
</tr>

{% for p in patients %}

<tr>

<td>{{p.patient.name}}</td>

<td>
<img src="{{p.patient.photo.url}}">
</td>

<td>{{p.patient.email}}</td>

<td>
<a href="/doctor/chat/{{p.patient.id}}">
<button style="background:#007BFF;color:white;border:none;padding:6px 12px;border-radius:5px;">
Chat
</button>
</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
