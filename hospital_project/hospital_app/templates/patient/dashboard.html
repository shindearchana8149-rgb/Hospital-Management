<!DOCTYPE html>
<html>
<head>
<title>Patient Dashboard</title>
<style>
/* Reset */
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* Colors */
:root {
    --primary: #FFD700; /* Yellow */
    --black: #000000;
    --white: #ffffff;
    --gray: #f4f4f4;
}

/* Body */
body{
    background: var(--gray);
    color: var(--black);
}

/* Navbar */
.navbar{
    background: var(--black);
    padding: 15px 50px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border-radius: 0 0 15px 15px;
}

.navbar a{
    color: var(--white);
    text-decoration: none;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: 600;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.05);
}

.navbar a:hover{
    background: var(--primary);
    color: var(--black);
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Container */
.container{
    max-width:1200px;
    margin:20px auto;
    padding:20px;
}

/* Profile Card */
.profile{
    background: var(--white);
    padding:30px;
    margin-bottom:30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border-left: 6px solid var(--primary);
    display:flex;
    align-items:center;
    gap:20px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.profile:hover{
    transform: translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.profile img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:3px solid var(--primary);
    object-fit:cover;
}

.profile h3{
    font-size:1.8rem;
    color: var(--primary);
}

.profile p{
    font-size:1rem;
    color: var(--black);
}

/* Cards Section */
.cards{
    display:flex;
    flex-wrap:wrap;
    gap:30px;
    justify-content:center;
}

.card{
    background: var(--white);
    width:250px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    cursor:pointer;
}

.card:hover{
    transform: translateY(-10px);
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
    background: var(--primary);
    color: var(--white);
}

.card a{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
    font-size:1.1rem;
    color: var(--black);
    text-decoration:none;
    transition: color 0.3s;
}

.card:hover a{
    color: var(--white);
}

.card p{
    font-size:0.95rem;
    color: var(--black);
}

.card:hover p{
    color: var(--white);
}

/* Responsive */
@media(max-width:768px){
    .profile{
        flex-direction: column;
        align-items:center;
        text-align:center;
    }

    .navbar{
        flex-direction: column;
        border-radius: 0 0 15px 15px;
        gap:10px;
    }
}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <a href="/patient/dashboard/">Dashboard</a>
    <a href="/patient/book-appointment/">Book Appointment</a>
    <a href="/patient/my-appointments/">My Appointments</a>
    <a href="/patient/logout/">Logout</a>
</div>

<!-- Container -->
<div class="container">

<!-- Profile -->
<div class="profile">
    <img src="{{patient.photo.url}}" alt="Profile Photo">
    <div>
        <h3>Welcome, {{patient.name}}</h3>
        <p>Phone: {{patient.phone}}</p>
    </div>
</div>

<!-- Cards -->
<div class="cards">
    <div class="card">
        <a href="/patient/book-appointment/">Book Appointment</a>
        <p>Book doctor appointment</p>
    </div>
    <div class="card">
        <a href="/patient/my-appointments/">My Appointments</a>
        <p>View your scheduled appointments</p>
    </div>
    <div class="card">
        <a href="/patient/prescriptions/">Prescription</a>
        <p>View prescriptions provided by doctors</p>
    </div>
</div>

</div>
</body>
</html>
