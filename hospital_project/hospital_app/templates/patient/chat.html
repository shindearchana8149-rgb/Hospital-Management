<!DOCTYPE html>
<html>
<head>
<title>Chat with Doctor</title>

<style>

/* Reset */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
}

/* Navbar */

.navbar{
background:black;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar h3{
color:#FFD700;
}

/* Container */

.container{
width:600px;
margin:auto;
margin-top:30px;
}

/* Chat Box */

.chat-box{
height:400px;
background:white;
overflow-y:auto;
padding:15px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
margin-bottom:15px;
}

/* Messages */

.doctor{
background:#e6f0ff;
padding:10px;
margin:8px;
border-radius:10px;
width:60%;
}

.patient{
background:#FFD700;
padding:10px;
margin:8px;
border-radius:10px;
margin-left:auto;
width:60%;
text-align:right;
}

/* Form */

.form-box{
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px;
border-radius:20px;
border:1px solid #ddd;
}

button{
padding:12px 20px;
background:black;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

button:hover{
background:#FFD700;
color:black;
}

/* Responsive */

@media(max-width:700px){

.container{
width:95%;
}

}

</style>

</head>

<body>

<div class="navbar">
<h3>Chat with Dr. {{doctor.name}}</h3>

<a href="/patient/dashboard/" style="color:white;text-decoration:none;">
Back
</a>

</div>

<div class="container">

<!-- Chat Box -->

<div class="chat-box" id="chat-box">

{% for m in messages %}

{% if m.sender == "patient" %}

<div class="patient">
{{m.message}}
</div>

{% else %}

<div class="doctor">
{{m.message}}
</div>

{% endif %}

{% endfor %}

</div>


<form method="POST">

{% csrf_token %}

<div class="form-box">

<input type="text" name="message" placeholder="Type message..." required>

<button type="submit">Send</button>

</div>

</form>

</div>


<script>

function loadMessages(){

fetch(window.location.href)
.then(response => response.text())
.then(data => {

var parser = new DOMParser();
var html = parser.parseFromString(data,'text/html');

document.getElementById("chat-box").innerHTML =
html.getElementById("chat-box").innerHTML;

/* Auto scroll to bottom */

var chatBox = document.getElementById("chat-box");
chatBox.scrollTop = chatBox.scrollHeight;

});

}

/* Refresh every 1 second */

setInterval(loadMessages,1000);

</script>

</body>
</html>
