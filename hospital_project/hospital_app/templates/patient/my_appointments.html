<!DOCTYPE html>
<html>
<head>
<title>My Appointments</title>
<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* Colors */
:root{
    --primary: #FFD700; /* Yellow */
    --black: #000;
    --white: #fff;
    --gray: #f4f4f4;
}

/* Body */
body{
    background: var(--gray);
    color: var(--black);
}

/* Navbar */
.navbar{
    background: var(--black);
    padding: 15px 50px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border-radius: 0 0 15px 15px;
}

.navbar a{
    color: var(--white);
    text-decoration: none;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: 600;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.05);
}

.navbar a:hover{
    background: var(--primary);
    color: var(--black);
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Container */
.container{
    max-width: 1200px;
    margin: 30px auto;
    padding: 20px;
}

/* Heading */
h2{
    text-align: center;
    color: var(--primary);
    margin-bottom: 20px;
    letter-spacing: 1px;
}

/* Table */
table{
    width:100%;
    border-collapse: collapse;
    background: var(--white);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

th, td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
    transition: background 0.3s, color 0.3s;
}

th{
    background: var(--black);
    color: var(--white);
}

tr:nth-child(even){
    background:#f9f9f9;
}

tr:hover{
    background: var(--primary);
    color: var(--black);
}

/* Doctor Images */
img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--primary);
}

/* Responsive */
@media(max-width:768px){
    .navbar{
        flex-direction: column;
        gap:10px;
        border-radius: 0 0 15px 15px;
    }
    table, th, td{
        font-size:14px;
    }
}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <a href="/patient/dashboard/">Dashboard</a>
    <a href="/patient/book-appointment/">Book Appointment</a>
    <a href="/patient/my-appointments/">My Appointments</a>
    <a href="/patient/prescriptions/">Prescriptions</a>
    <a href="/patient/logout/">Logout</a>
</div>

<!-- Container -->
<div class="container">

<h2>My Appointments</h2>

<table>
<tr>
<th>Doctor</th>
<th>Photo</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
<th>Chat</th>
</tr>

{% for a in appointments %}
<tr>
<td>{{a.doctor.name}}</td>
<td><img src="{{a.doctor.photo.url}}" alt="Doctor Photo"></td>
<td>{{a.date}}</td>
<td>{{a.time}}</td>
<td>{{a.status}}</td>
<td>
<a href="/patient/chat/{{a.doctor.id}}">
<button style="background:#FFD700;border:none;padding:6px 12px;border-radius:5px;">
Chat
</button>
</a>
</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
