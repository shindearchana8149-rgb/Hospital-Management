<!DOCTYPE html>
<html>
<head>
<title>Book Appointment</title>
<style>
/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

/* Colors */
:root{
    --primary: #FFD700; /* Yellow */
    --black: #000;
    --white: #fff;
    --gray: #f4f4f4;
}

/* Body */
body{
    background: var(--gray);
    color: var(--black);
}

/* Navbar */
.navbar{
    background: var(--black);
    padding: 15px 50px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border-radius: 0 0 15px 15px;
}

.navbar a{
    color: var(--white);
    text-decoration: none;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: 600;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.05);
}

.navbar a:hover{
    background: var(--primary);
    color: var(--black);
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* Container */
.container{
    width: 400px;
    max-width: 90%;
    margin: 50px auto;
    background: var(--white);
    padding: 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border-radius: 15px;
}

/* Heading */
h2{
    text-align: center;
    color: var(--primary);
    margin-bottom: 25px;
    letter-spacing: 1px;
}

/* Labels and Inputs */
label{
    font-weight: bold;
    margin-bottom: 5px;
    display:block;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid var(--black);
    border-radius:5px;
    outline:none;
    transition: 0.3s;
}

input:focus, select:focus{
    border-color: var(--primary);
    box-shadow:0 0 5px var(--primary);
}

/* Button */
button{
    background: var(--primary);
    color: var(--black);
    padding:12px;
    border:none;
    border-radius:50px;
    width:100%;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition: all 0.3s ease;
}

button:hover{
    background: #e6c200;
    transform: translateY(-2px);
}

/* Responsive */
@media(max-width:500px){
    .container{
        padding:20px;
    }
    h2{
        font-size:24px;
    }
    .navbar{
        flex-direction: column;
        gap:10px;
        border-radius:0 0 15px 15px;
    }
}
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <a href="/patient/dashboard/">Dashboard</a>
    <a href="/patient/book-appointment/">Book Appointment</a>
    <a href="/patient/my-appointments/">My Appointments</a>
    <a href="/patient/prescriptions/">Prescriptions</a>
    <a href="/patient/logout/">Logout</a>
</div>

<!-- Container -->
<div class="container">

<h2>Book Appointment</h2>

<form method="POST">
{% csrf_token %}

<label>Select Doctor</label>
<select name="doctor">
{% for d in doctors %}
<option value="{{d.id}}">{{d.name}} - {{d.department}}</option>
{% endfor %}
</select>

<label>Date</label>
<input type="date" name="date">

<label>Time</label>
<input type="time" name="time">

<button type="submit">Book Appointment</button>

</form>

</div>

</body>
</html>
